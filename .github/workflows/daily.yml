name: 🌍 Daily Pulse

on:
  schedule:
    - cron: "17 9,14,19 * * *"   # 3 runs/day instead of 24
  workflow_dispatch:

permissions:
  contents: write

# Queue hourly runs instead of letting two overlap and race on the push
concurrency:
  group: daily-pulse
  cancel-in-progress: false

jobs:
  update:
    name: Fetch & Commit Daily Data
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5   # v4 ran on Node 20, which GitHub removed from runners on 2026-09-16
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6   # v5 ran on Node 20
        with:
          python-version: "3.12"

      - name: Run randomizer & maybe fetch data
        run: python scripts/randomizer.py

      - name: Commit and push (if randomizer said yes)
        run: |
          git config user.name  "ChintzRuparel"
          git config user.email "chintz0952@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Skipped this hour (by design)."
          else
            MSG=$(cat /tmp/commit_msg.txt 2>/dev/null || echo "data: update snapshot")
            git commit -m "$MSG"
            # If something landed on the branch since checkout, rebase onto it rather than failing
            git push || (git pull --rebase && git push)
            echo "Committed: $MSG"
          fi
