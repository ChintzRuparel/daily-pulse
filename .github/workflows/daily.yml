name: 🌍 Daily Pulse

on:
  schedule:
    # Runs every day at 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch:  # also lets you trigger it manually from GitHub UI anytime

permissions:
  contents: write   # needed to push commits back to the repo

jobs:
  update:
    name: Fetch & Commit Daily Data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Check out repo ──────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 3. Run the data fetcher ────────────────────────────────────────────
      - name: Fetch daily data
        run: python scripts/fetch_daily.py

      # ── 4. Commit & push if anything changed ──────────────────────────────
      - name: Commit and push
        run: |
          git config user.name  "Daily Pulse Bot"
          git config user.email "daily-pulse-bot@users.noreply.github.com"

          git add data/ README.md

          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "Nothing changed today — skipping commit."
          else
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "data: daily snapshot ${DATE}

          - NASA APOD updated
          - Trending GitHub repos refreshed
          - Crypto prices (BTC, ETH, SOL) snapshotted
          - Quote of the day updated
          - Fun fact of the day"

            git push
            echo "✅ Committed and pushed!"
          fi
