name: 🌍 Daily Pulse

on:
  schedule:
    # Fires every hour — the Python randomizer decides if this hour actually commits
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Fetch & Commit Daily Data
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run randomizer & maybe fetch data
        run: python scripts/randomizer.py

      - name: Commit and push (if randomizer said yes)
        run: |
          git config user.name  "Daily Pulse Bot"
          git config user.email "daily-pulse-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Skipped this hour (by design)."
          else
            MSG=$(cat /tmp/commit_msg.txt 2>/dev/null || echo "data: update snapshot")
            git commit -m "$MSG"
            git push
            echo "Committed: $MSG"
          fi